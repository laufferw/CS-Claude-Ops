name: Release skills

# Runs when a v* tag is pushed, or from the Actions tab ("Run workflow"),
# which creates the v<version> tag from .claude-plugin/plugin.json itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the repo
        run: python3 tools/check_repo.py
      - name: Work out the tag from the plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}"; exit 1; }
          fi
          echo "TAG=v${version}" >> "$GITHUB_ENV"
      - name: Build skill zips
        run: python3 tools/build_skills.py --zip dist
      - name: Create the release with one zip per skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python3 -c "import re; t=open('CHANGELOG.md').read(); v='${TAG}'[1:]; m=re.search(r'^## '+re.escape(v)+r'\n(.*?)(?=^## |\Z)', t, re.S|re.M); print(m.group(1).strip() if m else '')")
          gh release create "${TAG}" dist/*.zip --target "${GITHUB_SHA}" --title "Outcome-Led CS Ops ${TAG}" --notes "${notes}"
